name: 问题反馈 / Bug report
description: 某个功能没有按预期工作
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么、看到了什么、本来以为会怎样。有截图更好。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「智能清理」
        2. 勾选……
        3. ……
  - type: input
    id: version
    attributes:
      label: DiskMate 版本
      description: 在「设置 → 应用 → 已安装的应用」里能看到，或安装包文件名里的版本号
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 按 Win+R 输入 winver 查看
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: 如果是闪退（可选）
      description: |
        新版本闪退时会在 `%LOCALAPPDATA%\com.cjxhaaa.diskmate\crashes` 里留下 `.dmp` 文件（崩溃转储）。把最新的一个压缩成 .zip 拖进这里，就能看出崩在哪一行。.dmp 里可能带有你电脑上的文件路径等信息，介意的话先在这里说一声，再私下发送。
        也可以按 Win+R 输入 `eventvwr`，在「Windows 日志 → 应用程序」里找闪退时间点、来源为「Application Error」的错误，把「错误模块名称」和「异常代码」贴在这里。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私
      options:
        - label: 我已检查截图和描述里没有不想公开的个人信息（用户名、文件名、聊天记录等）
          required: true
