# Builds the Windows installer and attaches it to a draft release.
#
# To release: bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json,
# add a CHANGELOG entry, push, then run this workflow from the Actions tab with the new tag
# (e.g. v0.2.0). Review the draft release it creates (installer + portable zip) and publish it.
# Then update bucket/diskmate.json (version, url, hash of the portable zip) so Scoop users get it.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.2.0"
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The release page shows what changed instead of only linking to the CHANGELOG: this
      # version's section of CHANGELOG.md, plus which file to download.
      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $v = "${{ inputs.tag }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -like "## ``[$v``]*" })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $v" }
          $end = [array]::FindIndex([string[]]$lines, $start + 1, [Predicate[string]]{ param($l) $l -like "## *" })
          if ($end -lt 0) { $end = $lines.Count }
          $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          $body += "`n`n### 下载`n`n- **安装版**：DiskMate_${v}_x64-setup.exe（推荐）`n- **便携版**：DiskMate_${v}_x64_portable.zip，解压即用`n- **Scoop**：``scoop update diskmate```n- DiskMate_${v}_x64_symbols.zip 是调试符号，只用来分析崩溃文件，不需要下载。"
          "body<<NOTES_EOF`n$body`nNOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: DiskMate ${{ inputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ inputs.tag }}".TrimStart("v")
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item src-tauri/target/release/diskmate.exe portable/DiskMate.exe
          Copy-Item packaging/portable-readme.txt "portable/说明.txt"
          $zip = "DiskMate_${v}_x64_portable.zip"
          Compress-Archive -Path portable/* -DestinationPath $zip
          gh release upload "${{ inputs.tag }}" $zip --clobber
          "sha256: " + (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

      # Not for users: the .pdb that turns a crash dump (crashes\*.dmp in the data folder) into
      # a stack with file and line. It only matches the diskmate.exe built in this run.
      - name: Debug symbols
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ inputs.tag }}".TrimStart("v")
          $sym = "DiskMate_${v}_x64_symbols.zip"
          Compress-Archive -Path src-tauri/target/release/diskmate.pdb -DestinationPath $sym
          gh release upload "${{ inputs.tag }}" $sym --clobber
