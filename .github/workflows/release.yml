# Builds the Windows installer and attaches it to a draft release.
#
# To release: bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json,
# add a CHANGELOG entry, push, then run this workflow from the Actions tab with the new tag
# (e.g. v0.2.0). Review the draft release it creates and publish it.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.2.0"
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: DiskMate ${{ inputs.tag }}
          releaseBody: 更新内容见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)。
          releaseDraft: true
          prerelease: false
